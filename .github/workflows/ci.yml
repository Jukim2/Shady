name: Validate project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run smoke test
        run: python tests/test_smoke.py
